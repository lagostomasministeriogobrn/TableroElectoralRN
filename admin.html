<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Carga Electoral Río Negro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rnblue: '#0072CE',
                        rngreen: '#18B753',
                        rnlight: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-shadow { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="bg-rnlight text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-800 text-white shadow-md border-b-4 border-rngreen">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-4 mb-2 md:mb-0">
                <h1 class="text-lg md:text-xl font-semibold tracking-tight">⚙️ Panel de Administración - Carga de Actas Electorales</h1>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <a href="index.html" class="bg-rngreen text-white font-bold px-3 py-1.5 rounded text-xs hover:bg-green-600 transition shadow">Ver Tablero Público 📊</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-white p-6 rounded border border-slate-200 custom-shadow space-y-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700 border-b pb-2">Selección de Circuito y Ubicación</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Año</label>
                    <select id="admin-year" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-xs font-semibold">
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                        <option value="2025">2025</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Circuito Electoral</label>
                    <select id="admin-circuit" onchange="actualizarLocalidadesAdmin()" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-xs font-semibold">
                        <option value="Provincial" selected>Provincia / General</option>
                        <option value="Alto Valle Centro">Alto Valle Centro</option>
                        <option value="Alto Valle Este">Alto Valle Este</option>
                        <option value="Alto Valle Oeste">Alto Valle Oeste</option>
                        <option value="Circuito Andino">Circuito Andino</option>
                        <option value="Circuito Atlántico">Circuito Atlántico</option>
                        <option value="Línea Sur">Línea Sur</option>
                        <option value="Valle Inferior">Valle Inferior</option>
                        <option value="Valle Medio">Valle Medio</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Localidad / Municipio</label>
                    <select id="admin-locality" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-xs font-semibold">
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Categoría</label>
                    <select id="admin-category" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-xs font-semibold">
                        <option value="GOB">Gobernador / Vice</option>
                        <option value="LEGP">Legislador Representación Poblacional</option>
                        <option value="LEGC">Legislador Circuital</option>
                        <option value="INT">Intendente Municipal</option>
                        <option value="CON">Concejal Municipal</option>
                        <option value="COF">Comisión de Fomento</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded border border-slate-200">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Mesas Procesadas</label>
                    <input type="text" id="admin-mesas" placeholder="Ej: 45 / 45" class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">% Participación</label>
                    <input type="text" id="admin-participacion" placeholder="Ej: 75.40%" class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Votos Blanco</label>
                    <input type="number" id="admin-blanco" value="0" class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 text-xs">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Votos Nulos</label>
                    <input type="number" id="admin-nulos" value="0" class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 text-xs">
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-700">Listas y Votos</h3>
                    <button onclick="agregarFilaLista()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1 rounded text-xs transition">+ Agregar Lista</button>
                </div>
                <div id="listas-container" class="space-y-3">
                </div>
            </div>

            <div class="flex justify-between items-center pt-4 border-t">
                <span id="admin-status" class="text-xs font-semibold text-slate-500">Listo para cargar.</span>
                <button onclick="guardarEnSupabase()" class="bg-rngreen hover:bg-green-600 text-white font-black px-6 py-2 rounded text-xs transition shadow">Guardar en Supabase ☁️</button>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://wyvxnzklfvhhzphubjik.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y8F-G_AnbvTRT7Z46vNoBQ_2TioQnLq';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const jerarquiaCircuitos = {
            "Provincial": { municipios: ["Provincial General"], fomentos: [] },
            "Alto Valle Centro": { municipios: ["Allen", "Cervantes", "General Roca"], fomentos: ["Cerro Policía", "El Cuy", "Mencué"] },
            "Alto Valle Este": { municipios: ["Chichinales", "Villa Regina", "Gral. E Godoy", "Mainqué", "Ing. Huergo"], fomentos: ["Valle Azul"] },
            "Alto Valle Oeste": { municipios: ["Barda del Medio", "Catriel", "Cinco Saltos", "Cipolletti", "Campo Grande"], fomentos: [] },
            "Línea Sur": { municipios: ["Los Menucos", "Maquinchao", "Sierra Colorada", "Ing. Jacobacci"], fomentos: [] },
            "Circuito Andino": { municipios: ["El Bolsón", "San Carlos de Bariloche", "Ñorquinco", "Dina Huapi"], fomentos: [] },
            "Circuito Atlántico": { municipios: ["San Antonio Oeste", "Valcheta"], fomentos: [] },
            "Valle Inferior": { municipios: ["Viedma", "Gral. Conesa", "Guardia Mitre"], fomentos: [] },
            "Valle Medio": { municipios: ["Río Colorado", "Pomona", "Luis Beltrán", "Lamarque", "Darwin", "Choele Choel", "Chimpay"], fomentos: [] }
        };

        function actualizarLocalidadesAdmin() {
            const circ = document.getElementById('admin-circuit').value;
            const locSelect = document.getElementById('admin-locality');
            locSelect.innerHTML = "";
            let datos = jerarquiaCircuitos[circ] || { municipios: [], fomentos: [] };
            
            if (circ === "Provincial") {
                let opt = document.createElement('option');
                opt.value = "Provincial General";
                opt.innerText = "Provincial General";
                locSelect.appendChild(opt);
                return;
            }

            datos.municipios.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                locSelect.appendChild(opt);
            });
        }

        function agregarFilaLista(nombre = "", votos = 0) {
            const container = document.getElementById('listas-container');
            const div = document.createElement('div');
            div.className = "flex items-center gap-3 fila-lista";
            div.innerHTML = `
                <input type="text" placeholder="Nombre de la Lista / Alianza" value="${nombre}" class="nombre-lista flex-grow bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-xs font-semibold">
                <input type="number" placeholder="Votos" value="${votos}" class="votos-lista w-32 bg-slate-50 border border-slate-300 rounded px-3 py-1.5 text-xs font-semibold">
                <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 font-bold px-2 text-xs">✕</button>
            `;
            container.appendChild(div);
        }

        async function guardarEnSupabase() {
            const anio = parseInt(document.getElementById('admin-year').value);
            const circuito = document.getElementById('admin-circuit').value;
            const localidad = document.getElementById('admin-locality').value;
            const categoria = document.getElementById('admin-category').value;
            const mesas = document.getElementById('admin-mesas').value;
            const participacion = document.getElementById('admin-participacion').value;
            const blanco = parseInt(document.getElementById('admin-blanco').value) || 0;
            const nulos = parseInt(document.getElementById('admin-nulos').value) || 0;
            const status = document.getElementById('admin-status');

            const filas = document.querySelectorAll('.fila-lista');
            if (filas.length === 0) {
                alert("Agregá al menos una lista antes de guardar.");
                return;
            }

            status.innerText = "Guardando en Supabase...";

            try {
                // Limpiamos cargas previas de esta localidad/categoría
                await supabaseClient
                    .from('resultados_mesas')
                    .delete()
                    .eq('anio', anio)
                    .ilike('localidad', localidad)
                    .eq('categoria', categoria);

                // Insertamos las filas limpias
                let aInsertar = [];
                filas.forEach((f, idx) => {
                    let nombre = f.querySelector('.nombre-lista').value.trim();
                    let votos = parseInt(f.querySelector('.votos-lista').value) || 0;
                    if (nombre) {
                        aInsertar.push({
                            anio: anio,
                            circuito_id: circuito,
                            localidad: localidad,
                            categoria: categoria,
                            lista_id: idx + 1,
                            nombre_lista: nombre,
                            votos: votos,
                            votos_blanco: blanco,
                            votos_nulos: nulos,
                            mesas_procesadas: mesas,
                            porcentaje_participacion: participacion
                        });
                    }
                });

                const { error } = await supabaseClient.from('resultados_mesas').insert(aInsertar);
                if (error) throw error;

                status.innerText = "¡Guardado con éxito en Supabase!";
                alert("¡Datos guardados correctamente!");
            } catch (err) {
                console.error(err);
                status.innerText = "Error al guardar en Supabase.";
            }
        }

        window.onload = function() {
            actualizarLocalidadesAdmin();
            agregarFilaLista("Alianza Juntos Somos Río Negro", 0);
            agregarFilaLista("Alianza Cambia Río Negro", 0);
        };
    </script>
</body>
</html>
