<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Río Negro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { rnblue: '#0072CE', rngreen: '#18B753', rnlight: '#F8FAFC' } } } }
    </script>
</head>
<body class="bg-rnlight text-slate-800 font-sans min-h-screen flex flex-col">
    <header class="bg-rngreen text-white shadow-md border-b-4 border-rnblue">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-semibold">Panel Administrativo - Dirección de Asuntos Electorales</h1>
            <a href="index.html" target="_blank" class="bg-white text-rngreen font-bold px-3 py-1.5 rounded text-xs shadow">Ver Tablero Público ↗</a>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg flex justify-between items-center">
            <p class="text-xs text-slate-700 font-medium">Sube tu archivo CSV oficial para actualizar los datos en Supabase:</p>
            <input type="file" id="file-uploader" accept=".csv" onchange="handleSmartUpload(event)" class="text-xs text-slate-500 file:py-2 file:px-4 file:rounded file:border-0 file:bg-rnblue file:text-white cursor-pointer">
        </div>
        <div class="bg-white p-6 rounded border border-slate-200 shadow-sm space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Año Electoral</label>
                    <select id="admin-year" onchange="loadAdminData()" class="w-full bg-slate-50 border rounded px-3 py-2 text-sm font-semibold">
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                        <option value="2025">2025</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Categoría</label>
                    <select id="admin-election-type" onchange="loadAdminData()" class="w-full bg-slate-50 border rounded px-3 py-2 text-sm font-semibold">
                        <option value="GOB" selected>Gobernador / Vice (GOB)</option>
                        <option value="LEGP">Legislador Rep. Poblacional</option>
                        <option value="LEGC">Legislador Circuital</option>
                        <option value="INT">Intendente Municipal</option>
                        <option value="CON">Concejal Municipal</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Circuito</label>
                    <select id="admin-circuit" onchange="loadAdminData()" class="w-full bg-slate-50 border rounded px-3 py-2 text-sm font-semibold">
                        <option value="RN.1">1. Valle Inferior (RN.1)</option>
                        <option value="RN.2" selected>2. Atlántico / Alto Valle Este (RN.2)</option>
                        <option value="RN.3">3. Andino (RN.3)</option>
                        <option value="RN.4">4. Atlántico (RN.4)</option>
                        <option value="RN.5">5. Alto Valle Centro (RN.5)</option>
                        <option value="RN.6">6. Alto Valle Oeste (RN.6)</option>
                        <option value="RN.7">7. Valle Medio (RN.7)</option>
                        <option value="RN.8">8. Región Sur (RN.8)</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Sub-válidos (Blanco / Nulos)</label>
                <input type="text" id="admin-subvalidos" class="w-full border rounded px-3 py-1.5 text-sm font-semibold" value="Blanco: 0 | Nulos: 0">
            </div>
            <div id="admin-parties-container" class="space-y-3"></div>
            <div class="flex justify-between items-center pt-4 border-t">
                <span id="admin-status" class="text-xs font-bold"></span>
                <button onclick="saveAdminData()" class="bg-rngreen hover:bg-green-600 text-white font-bold px-6 py-2.5 rounded text-sm shadow">Guardar en Supabase ☁️</button>
            </div>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://wyvxnzklfvhhzphubjik.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y8F-G_AnbvTRT7Z46vNoBQ_2TioQnLq';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdminData() {
            const anio = parseInt(document.getElementById('admin-year').value);
            const categoria = document.getElementById('admin-election-type').value;
            const circuito = document.getElementById('admin-circuit').value;
            let { data } = await supabaseClient.from('resultados_mesas').select('*').eq('anio', anio).eq('circuito_id', circuito).eq('categoria', categoria);
            if (data && data.length > 0) {
                document.getElementById('admin-subvalidos').value = `Blanco: ${data[0].votos_blanco || 0} | Nulos: ${data[0].votos_nulos || 0}`;
                renderPartiesRows(data);
            } else {
                renderPartiesRows([]);
            }
        }

        function renderPartiesRows(data) {
            const container = document.getElementById('admin-parties-container');
            container.innerHTML = "";
            if (!data.length) { container.innerHTML = `<p class="text-xs text-slate-400 italic">Sin datos cargados para este año.</p>`; return; }
            data.forEach((row, idx) => {
                container.innerHTML += `
                    <div class="flex items-center gap-2 party-row bg-slate-50 p-2 rounded border">
                        <input type="text" value="${row.lista_id}" class="w-16 text-xs font-bold text-center border rounded party-id">
                        <input type="text" value="${row.nombre_lista || 'Lista'}" class="w-full text-xs font-semibold border rounded px-2 py-1 party-name">
                        <input type="number" value="${row.votos}" class="w-28 text-right border rounded px-2 py-1 text-sm font-bold party-votes">
                    </div>`;
            });
        }

        async function handleSmartUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsText(file, "UTF-8");
            reader.onload = function(e) {
                const lines = e.target.result.split(/\r\n|\n/).filter(l => l.trim() !== "");
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                let rawParties = [];
                for (let i = 1; i < lines.length; i++) {
                    let cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                    if (cols.length < headers.length) continue;
                    let clase = cols[headers.indexOf('clase_candidatura')] || "";
                    if (clase.toLowerCase() === 'lista') {
                        rawParties.push({ id: cols[headers.indexOf('id_candidatura')], name: cols[headers.indexOf('descripcion_candidatura')], votos: parseInt(cols[headers.indexOf('cant_votos')]) || 0 });
                    }
                }
                renderPartiesRows(rawParties.map(p => ({ lista_id: p.id, nombre_lista: p.name, votos: p.votos })));
                document.getElementById('admin-status').innerText = "✓ CSV leído con éxito.";
            }
        }

        async function saveAdminData() {
            const anio = parseInt(document.getElementById('admin-year').value);
            const categoria = document.getElementById('admin-election-type').value;
            const circuito_id = document.getElementById('admin-circuit').value;
            const subValidosText = document.getElementById('admin-subvalidos').value;
            let blanco = parseInt((subValidosText.match(/Blanco:\s*(\d+)/i) || [])[1]) || 0;
            let nulos = parseInt((subValidosText.match(/Nulos:\s*(\d+)/i) || [])[1]) || 0;

            await supabaseClient.from('resultados_mesas').delete().eq('anio', anio).eq('circuito_id', circuito_id).eq('categoria', categoria);
            
            let rows = [];
            document.querySelectorAll('.party-row').forEach(row => {
                rows.push({
                    anio: anio,
                    circuito_id: circuito_id,
                    categoria: categoria,
                    mesa_numero: 1,
                    lista_id: parseInt(row.querySelector('.party-id').value) || 0,
                    nombre_lista: row.querySelector('.party-name').value.trim(),
                    votos: parseInt(row.querySelector('.party-votes').value) || 0,
                    votos_blanco: blanco,
                    votos_nulos: nulos
                });
            });

            if (rows.length) {
                await supabaseClient.from('resultados_mesas').insert(rows);
                document.getElementById('admin-status').innerText = "✓ ¡Guardado en Supabase!";
            }
        }
        window.onload = loadAdminData;
    </script>
</body>
</html>
