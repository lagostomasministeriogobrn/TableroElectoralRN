<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Electoral - Río Negro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { rnblue: '#0072CE', rngreen: '#18B753', rnlight: '#F8FAFC' } } } }
    </script>
</head>
<body class="bg-rnlight text-slate-800 font-sans min-h-screen flex flex-col">
    <header class="bg-rngreen text-white shadow-md border-b-4 border-rnblue">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-semibold">Tablero Público de Resultados - Río Negro</h1>
            <a href="admin.html" class="bg-white text-rngreen font-bold px-3 py-1.5 rounded text-xs shadow">Panel Admin ⚙️</a>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
        <div class="bg-white p-4 rounded border flex flex-wrap gap-4 items-center">
            <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Año</label>
                <select id="public-year" onchange="loadPublicData()" class="bg-slate-50 border rounded px-3 py-1.5 text-xs font-semibold">
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2025">2025</option>
                    <option value="2023">2023</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Categoría</label>
                <select id="public-election-type" onchange="loadPublicData()" class="bg-slate-50 border rounded px-3 py-1.5 text-xs font-semibold">
                    <option value="GOB" selected>Gobernador / Vice</option>
                    <option value="LEGP">Legislador Rep. Poblacional</option>
                    <option value="LEGC">Legislador Circuital</option>
                    <option value="INT">Intendente Municipal</option>
                    <option value="CON">Concejal Municipal</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Circuito</label>
                <select id="public-circuit" onchange="loadPublicData()" class="bg-slate-50 border rounded px-3 py-1.5 text-xs font-semibold">
                    <option value="RN.1">1. Valle Inferior (RN.1)</option>
                    <option value="RN.2" selected>2. Atlántico / Alto Valle Este (RN.2)</option>
                    <option value="RN.3">3. Andino (RN.3)</option>
                    <option value="RN.4">4. Atlántico (RN.4)</option>
                    <option value="RN.5">5. Alto Valle Centro (RN.5)</option>
                    <option value="RN.6">6. Alto Valle Oeste (RN.6)</option>
                    <option value="RN.7">7. Valle Medio (RN.7)</option>
                    <option value="RN.8">8. Región Sur (RN.8)</option>
                </select>
            </div>
            <span id="public-status" class="text-xs text-slate-500 mt-4">Cargando...</span>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded border text-center">
                <span class="text-[10px] uppercase font-bold text-slate-400 block">Votos Procesados (Votantes)</span>
                <h3 id="stat-procesados" class="text-2xl font-black text-rnblue">0</h3>
            </div>
            <div class="bg-white p-4 rounded border text-center">
                <span class="text-[10px] uppercase font-bold text-slate-400 block">Sub-válidos</span>
                <h3 id="stat-subvalidos" class="text-sm font-bold text-slate-600 mt-2">Blanco: 0 | Nulos: 0</h3>
            </div>
        </div>
        <div class="bg-white p-6 rounded border space-y-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-700 border-b pb-2">Resultados Oficiales</h2>
            <div id="public-results-container" class="space-y-4"></div>
        </div>
    </main>
    <script>
        const SUPABASE_URL = 'https://wyvxnzklfvhhzphubjik.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y8F-G_AnbvTRT7Z46vNoBQ_2TioQnLq';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPublicData() {
            const anio = parseInt(document.getElementById('public-year').value);
            const categoria = document.getElementById('public-election-type').value;
            const circuito = document.getElementById('public-circuit').value;
            
            let { data } = await supabaseClient.from('resultados_mesas').select('*').eq('anio', anio).eq('circuito_id', circuito).eq('categoria', categoria);
            
            const container = document.getElementById('public-results-container');
            if (!data || !data.length) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-6">Sin datos cargados para el año ${anio}.</p>`;
                document.getElementById('stat-procesados').innerText = "0";
                document.getElementById('stat-subvalidos').innerText = "Blanco: 0 | Nulos: 0";
                return;
            }

            let blanco = data[0].votos_blanco || 0;
            let nulos = data[0].votos_nulos || 0;
            let totalValidos = 0;
            data.forEach(r => totalValidos += r.votos || 0);
            
            document.getElementById('stat-procesados').innerText = (totalValidos + blanco + nulos).toLocaleString();
            document.getElementById('stat-subvalidos').innerText = `Blanco: ${blanco.toLocaleString()} | Nulos: ${nulos.toLocaleString()}`;

            container.innerHTML = "";
            let colors = ["#0072CE", "#18B753", "#FBB03B", "#DA251D", "#88D9E8"];
            data.sort((a, b) => b.votos - a.votos).forEach((row, idx) => {
                let pct = totalValidos > 0 ? ((row.votos / totalValidos) * 100).toFixed(2) : "0.00";
                container.innerHTML += `
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                            <span>${row.nombre_lista || 'Lista ' + row.lista_id}</span>
                            <span class="font-bold">${row.votos.toLocaleString()} votos (${pct}%)</span>
                        </div>
                        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden border">
                            <div class="h-full" style="width: ${pct}%; background-color: ${colors[idx % colors.length]};"></div>
                        </div>
                    </div>`;
            });
            document.getElementById('public-status').innerText = "✓ Sincronizado";
        }
        window.onload = loadPublicData;
    </script>
</body>
</html>
